<!doctype html>
<meta charset="utf-8">
<title>social-preview</title>
<link rel="stylesheet" href="brand.css">
<!--
  The GitHub social preview, 1280×640 at 1× (GitHub wants that exact ratio and
  crops nothing at it). Uploaded by hand under Settings → Social preview; there
  is no API for it. Everything sits inside the middle 1200×600 so a platform
  that crops to a squarer card still shows the name and the tagline.

  Rendered by `npm run assets` in collector/ to docs/img/social-preview.png.
-->
<div class="figure wide">
<svg viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="Fleet Runner: a shelf of old phones, turned into a device lab you can send work to. On-device ML benchmarks, real-device UI tests, visual regression, one job queue.">

  <rect x="0" y="0" width="1280" height="6" fill="var(--amber)"/>

  <!-- the mark, no tile -->
  <g transform="translate(108 176) scale(1.45)">
    <rect x="1.25" y="1.25" width="17.5" height="31.5" rx="3.25" fill="none" stroke="var(--amber)" stroke-width="2.5"/>
    <path d="M4.5 17h2.6l1.9-5.4 2.9 11 2-5.6h1.6" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7.5 28.25h5" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text class="t-display" x="192" y="236" style="font-size:80px;letter-spacing:-.02em">Fleet Runner</text>
  <text class="t-display" x="92" y="322" style="font-size:38px;font-weight:600;fill:#B9C0C8">A shelf of old phones, turned into a device lab you can send</text>
  <text class="t-display" x="92" y="368" style="font-size:38px;font-weight:600;fill:#B9C0C8">work to.</text>

  <!-- the four things it does -->
  <g class="t-mono-amber" style="font-size:19px">
    <rect class="l-structure" x="92" y="424" width="310" height="44" rx="6"/>
    <text x="247" y="452" text-anchor="middle">on-device ML benchmarks</text>
    <rect class="l-structure" x="414" y="424" width="274" height="44" rx="6"/>
    <text x="551" y="452" text-anchor="middle">real-device UI tests</text>
    <rect class="l-structure" x="700" y="424" width="240" height="44" rx="6"/>
    <text x="820" y="452" text-anchor="middle">visual regression</text>
    <rect class="l-structure" x="952" y="424" width="192" height="44" rx="6"/>
    <text x="1048" y="452" text-anchor="middle">one job queue</text>
  </g>

  <text class="t-mono" x="92" y="590" style="font-size:19px">github.com/addisdev/fleet-runner</text>
</svg>
</div>
<script src="symbols.js"></script>
