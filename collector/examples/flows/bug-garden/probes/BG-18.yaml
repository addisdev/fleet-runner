# Probe BG-18: Search is case-sensitive.
#
# Walks the shortest path to the planted defect on the default build
# (defects on) and stops where it shows. Ends on 'No plants match "fern"'.
# Run by bug-garden/tools/verify-on-device.sh, which checks the signal.
appId: dev.fleetrunner.buggarden
---
- launchApp:
    clearState: true
- runFlow: ../sign-in.yaml
- tapOn:
    id: "button_search"
- tapOn:
    id: "field_search"
- inputText: "fern"
- hideKeyboard
- tapOn:
    id: "button_run_search"
- assertVisible: "No plants match "fern""
