# Probe BG-13: About screen shows Lorem ipsum.
#
# Walks the shortest path to the planted defect on the default build
# (defects on) and stops where it shows. Ends on About.
# Run by bug-garden/tools/verify-on-device.sh, which checks the signal.
appId: dev.fleetrunner.buggarden
---
- launchApp:
    clearState: true
- runFlow: ../sign-in.yaml
- tapOn:
    id: "button_settings"
- scrollUntilVisible:
    element:
      id: "button_about"
    direction: DOWN
- tapOn:
    id: "button_about"
- assertVisible: 'Lorem ipsum.*'
