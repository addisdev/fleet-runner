# Bench mission bench-add-thyme: Add a plant with every detail.
#
# The scripted answer to collector/examples/missions/bug-garden/bench-add-thyme.json,
# for checking that the mission's `check` block is right: run this, dump the
# tree, and the check must pass. It is also the shortest path a model could
# take, which makes it the step-count baseline for the bench.
#
# Runs on the clean build: Maestro passes `arguments` as intent extras, and
# garden_defects=false turns every planted defect off.
appId: dev.fleetrunner.buggarden
---
- launchApp:
    clearState: true
    arguments:
      garden_defects: "false"
- runFlow: ../sign-in.yaml
- tapOn:
    id: "button_add"
- tapOn:
    id: "field_name"
- inputText: "Thyme"
- tapOn:
    id: "field_species"
- inputText: "Thymus vulgaris"
- tapOn:
    id: "field_quantity"
- eraseText: 40
- inputText: "2"
- tapOn:
    id: "field_location"
- inputText: "Balcony"
- tapOn:
    id: "field_every"
- eraseText: 40
- inputText: "4"
- scrollUntilVisible:
    element:
      id: "button_save"
    direction: DOWN
- tapOn:
    id: "button_save"
- assertVisible: 'Qty 2 · Balcony · every 4 days'
