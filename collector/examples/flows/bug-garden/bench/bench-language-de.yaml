# Bench mission bench-language-de: Change the language to German.
#
# The scripted answer to collector/examples/missions/bug-garden/bench-language-de.json,
# for checking that the mission's `check` block is right: run this, dump the
# tree, and the check must pass. It is also the shortest path a model could
# take, which makes it the step-count baseline for the bench.
#
# Runs on the clean build: Maestro passes `arguments` as intent extras, and
# garden_defects=false turns every planted defect off.
appId: dev.fleetrunner.buggarden
---
- launchApp:
    clearState: true
    arguments:
      garden_defects: "false"
- runFlow: ../sign-in.yaml
- tapOn:
    id: "button_settings"
- scrollUntilVisible:
    element:
      id: "option_lang_de"
    direction: DOWN
- tapOn:
    id: "option_lang_de"
- assertVisible: 'Einstellungen'
