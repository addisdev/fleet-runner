# Per-PR device test. Copy into an app repo as .github/workflows/. See README.md.
#
# When (and only when) the fleet gets connected to real CI, a workflow like
# this goes into an app repo (e.g. your-app-android). Until then this file
# documents the contract and nothing reads it.
#
# ci-enqueue exits like `fleetr run`: 0 passed, 1 failed, 2 invalid spec,
# 3 still running at --timeout, 4 skipped (nothing ran), 5 refused/unreachable.
# Any non-zero exit fails the check, so a skip is not a green check.
#
# Requirements at connect time, none of which exist today by design:
#   - the runner host joined to the tailnet, FLEET_COLLECTOR_URL secret set
#   - FLEET_GITHUB_STATUS=1 + FLEET_GITHUB_TOKEN on the collector, so the
#     final commit status comes from the collector (this step's exit code
#     already fails the check without it)
name: fleet-device-smoke
on: pull_request

jobs:
  device-smoke:
    # Runs on the self-hosted runner that can reach the collector over Tailscale.
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Real-device smoke via fleet
        env:
          # A run token (plus agent if the collector sets FLEET_AUTH_PROTOCOL=token),
          # needed only when the collector runs with FLEET_AUTH=tokens.
          FLEET_RUNNER_TOKEN: ${{ secrets.FLEET_RUNNER_TOKEN }}
          # GITHUB_EVENT_NAME is pull_request here, so the build is uploaded on
          # the pr channel and never becomes the nightly's "latest".
        run: |
          cat > fleet-job.json <<EOF
          {
            "schema": 1,
            "job_id": "app-smoke-${{ github.event.pull_request.number }}-${{ github.run_attempt }}-${{ github.sha }}",
            "workload": "ui-test",
            "executor": "host",
            "app": { "name": "your-app-android", "build": "pr-${{ github.event.pull_request.number }}", "sha256": "replaced-by-upload" },
            "suite": { "kind": "maestro", "flows": "your-app/smoke.yaml" },
            "targets": { "exclusive": true },
            "lease": { "ttl_s": 1200 },
            "report_to": { "github_status": "${{ github.repository }}@${{ github.sha }}" }
          }
          EOF
          npx tsx scripts/ci-enqueue.ts \
            --collector "${{ secrets.FLEET_COLLECTOR_URL }}" \
            --job fleet-job.json \
            --artifact app/build/outputs/apk/debug/app-debug.apk \
            --timeout 1200
