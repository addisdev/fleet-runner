name: FleetRunner
options:
  bundleIdPrefix: com.taylab
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    visionOS: "1.0"
targets:
  FleetRunner:
    type: application
    platform: iOS
    sources:
      - path: FleetRunner
        excludes:
          # The other targets' Info.plists. Each of these is a *source* under
          # FleetRunner/, so without excluding them a target both copies them as
          # resources and processes its own -- "Multiple commands produce
          # .../Info.plist", which is a hard build failure and was one.
          - InfoTV.plist
          - InfoVision.plist
    # No llama.xcframework here, deliberately. The framework is 850 MB and
    # gitignored, and Xcode treats a declared-but-missing XCFramework as a hard
    # error ("There is no XCFramework found at ..."), not as something to skip
    # -- `optional: true` weak-links it, which is a different question. So a
    # spec that names it unconditionally is a spec that cannot be built from a
    # fresh clone, which is what this one used to be.
    #
    # Every llama call site is behind `#if canImport(llama)`, so this spec
    # builds and runs with the synthetic and Core ML backends, and the LLM
    # workloads report an honest "backend unavailable". To get the real thing,
    # build the framework and generate with project.llama.yml -- ./generate.sh
    # picks for you. See the README.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylab.fleetrunner
        MARKETING_VERSION: "0.5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
    info:
      path: FleetRunner/Info.plist
      properties:
        NSAppTransportSecurity:
          # The collector speaks plain HTTP inside the Tailscale mesh / localhost.
          NSAllowsLocalNetworking: true
        # From the build setting, not a literal. An explicit Info.plist takes
        # priority over MARKETING_VERSION, so without this line the app reports
        # `app_ver: "1.0"` on every registration -- which is exactly the drift
        # scripts/version.mjs was written to stop, reintroduced by the plist that
        # the URL scheme required.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          # `fleetrunner://join?url=...&device_id=...` -- how a device with no
          # keyboard worth using is told which collector to talk to. An Apple TV
          # has no camera for a QR code and its on-screen keyboard is a grid
          # driven by a remote, so for one of those this is the whole enrolment
          # story. Opened by `devicectl device process launch`, by `simctl
          # openurl`, from a QR code on another device, or from a tapped link.
          - CFBundleURLName: com.taylab.fleetrunner.join
            CFBundleURLSchemes: [fleetrunner]


  # --- the other screens -----------------------------------------------------
  #
  # One source tree, three products. The agent, the protocol, the synthetic
  # backend and the Core ML backend all compile unchanged for tvOS and
  # visionOS; what differs is what each platform HAS, and that is expressed as
  # compile-time conditions in the sources rather than as forks of them.
  #
  # These are separate targets rather than one target with more device
  # families because they are separate binaries built against separate SDKs.
  # That is also exactly why the runner resolves its `platform` at compile
  # time: a tvOS build and an iOS build are different products from one source,
  # and a benchmark table has to be able to tell them apart.

  FleetRunnerTV:
    type: application
    platform: tvOS
    # WebKit does not exist on tvOS, so the WKWebView capture workload cannot
    # compile here. Excluded from the target rather than #if'd inside the file:
    # the whole file is that one workload, and its route in FleetAgent is
    # already gated on `canImport(WebKit)`, so an Apple TV never declares the
    # capability either.
    #
    # WebShotsManifest.swift stays IN, and that is not an oversight. Its own
    # header says it is deliberately free of UIKit and WebKit so its parsing can
    # be checked without a device, and Protocol.swift refers to the type it
    # defines -- excluding it as well took the whole protocol down with it,
    # which is the tidy-looking mistake this note exists to stop somebody
    # repeating.
    sources:
      - path: FleetRunner
        excludes:
          - WebShotsWorkload.swift
          # The other targets' Info.plists. Each of these is a *source* under
          # FleetRunner/, so without excluding them a target both copies them as
          # resources and processes its own -- "Multiple commands produce
          # .../Info.plist", which is a hard build failure and was one.
          - Info.plist
          - InfoVision.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylab.fleetrunner.tv
        MARKETING_VERSION: "0.5.0"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

    info:
      path: FleetRunner/InfoTV.plist
      properties:
        # GENERATE_INFOPLIST_FILE cannot express an array, and the URL scheme is
        # one -- so this target gets a real plist rather than generated keys.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # From the build setting, not a literal. An explicit Info.plist takes
        # priority over MARKETING_VERSION, so without this line the app reports
        # `app_ver: "1.0"` on every registration -- which is exactly the drift
        # scripts/version.mjs was written to stop, reintroduced by the plist that
        # the URL scheme required.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          # `fleetrunner://join?url=...&device_id=...` -- how a device with no
          # keyboard worth using is told which collector to talk to. An Apple TV
          # has no camera for a QR code and its on-screen keyboard is a grid
          # driven by a remote, so for one of those this is the whole enrolment
          # story. Opened by `devicectl device process launch`, by `simctl
          # openurl`, from a QR code on another device, or from a tapped link.
          - CFBundleURLName: com.taylab.fleetrunner.join
            CFBundleURLSchemes: [fleetrunner]
  # NEVER COMPILED. Stated plainly because everything else in this repository
  # that claims to build has been built.
  #
  # visionOS keeps UIKit and WebKit, so there is no source-level reason this
  # would not compile -- unlike tvOS, which needed two guards and an exclusion
  # before it did. But the visionOS platform is not installed on the machine
  # this target was written on (`xcodebuild -showsdks` lists the SDK; the
  # platform itself is a separate download), so nobody has run the compiler
  # over it and this target is a hypothesis.
  #
  # The zero-risk alternative, if you want a headset on the shelf today: the
  # iOS target runs on Vision Pro unmodified as a "Designed for iPad" app. It
  # reports `platform: ios` when it does, which is correct -- it IS the iOS
  # binary -- and is exactly why this separate target exists at all: a native
  # visionOS build is a different product and should say so.
  FleetRunnerVision:
    type: application
    platform: visionOS
    sources:
      - path: FleetRunner
        excludes:
          # The other targets' Info.plists. Each of these is a *source* under
          # FleetRunner/, so without excluding them a target both copies them as
          # resources and processes its own -- "Multiple commands produce
          # .../Info.plist", which is a hard build failure and was one.
          - Info.plist
          - InfoTV.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylab.fleetrunner.vision
        MARKETING_VERSION: "0.5.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

    info:
      path: FleetRunner/InfoVision.plist
      properties:
        # GENERATE_INFOPLIST_FILE cannot express an array, and the URL scheme is
        # one -- so this target gets a real plist rather than generated keys.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # From the build setting, not a literal. An explicit Info.plist takes
        # priority over MARKETING_VERSION, so without this line the app reports
        # `app_ver: "1.0"` on every registration -- which is exactly the drift
        # scripts/version.mjs was written to stop, reintroduced by the plist that
        # the URL scheme required.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          # `fleetrunner://join?url=...&device_id=...` -- how a device with no
          # keyboard worth using is told which collector to talk to. An Apple TV
          # has no camera for a QR code and its on-screen keyboard is a grid
          # driven by a remote, so for one of those this is the whole enrolment
          # story. Opened by `devicectl device process launch`, by `simctl
          # openurl`, from a QR code on another device, or from a tapped link.
          - CFBundleURLName: com.taylab.fleetrunner.join
            CFBundleURLSchemes: [fleetrunner]
  FleetRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FleetRunnerUITests]
    dependencies:
      - target: FleetRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

schemes:
  FleetRunner:
    build:
      targets:
        FleetRunner: all
    test:
      targets: [FleetRunnerUITests]
  FleetRunnerTV:
    build:
      targets:
        FleetRunnerTV: all
  FleetRunnerVision:
    build:
      targets:
        FleetRunnerVision: all
