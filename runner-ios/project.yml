name: FleetRunner
options:
  bundleIdPrefix: com.taylab
  deploymentTarget:
    iOS: "17.0"
targets:
  FleetRunner:
    type: application
    platform: iOS
    sources: [FleetRunner]
    # No llama.xcframework here, deliberately. The framework is 850 MB and
    # gitignored, and Xcode treats a declared-but-missing XCFramework as a hard
    # error ("There is no XCFramework found at ..."), not as something to skip
    # -- `optional: true` weak-links it, which is a different question. So a
    # spec that names it unconditionally is a spec that cannot be built from a
    # fresh clone, which is what this one used to be.
    #
    # Every llama call site is behind `#if canImport(llama)`, so this spec
    # builds and runs with the synthetic and Core ML backends, and the LLM
    # workloads report an honest "backend unavailable". To get the real thing,
    # build the framework and generate with project.llama.yml -- ./generate.sh
    # picks for you. See the README.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylab.fleetrunner
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
    info:
      path: FleetRunner/Info.plist
      properties:
        NSAppTransportSecurity:
          # The collector speaks plain HTTP inside the Tailscale mesh / localhost.
          NSAllowsLocalNetworking: true

  FleetRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FleetRunnerUITests]
    dependencies:
      - target: FleetRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO

schemes:
  FleetRunner:
    build:
      targets:
        FleetRunner: all
    test:
      targets: [FleetRunnerUITests]
