name: runner-ios

# Called by ci.yml, which owns the change detection and the `ci-ok` check
# that branch protection requires. Nothing else triggers this file.
on:
  workflow_call:

defaults:
  run:
    working-directory: runner-ios

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      # Picks the spec this checkout can build. There is no llama.xcframework
      # here -- it is 850 MB and gitignored -- so this generates the project
      # without the llama.cpp backend, which is exactly the state a stranger
      # cloning the repo is in. If that ever stops building, this job is how
      # we find out.
      - run: ./generate.sh

      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project FleetRunner.xcodeproj \
            -scheme FleetRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Does the app link a Swift overlay that only exists for old deployment
      # targets? Seconds, no simulator, and it catches the exact bug that
      # shipped -- `import WebKit` hard-linking
      # /usr/lib/swift/libswiftWebKit.dylib, which newer runtimes do not carry
      # and dyld refuses to start a process without.
      #
      # There is a launch check too, runner-ios/launch-smoke.sh, and it is
      # deliberately NOT run here. It boots a simulator, which costs about
      # seven minutes on this runner, and it cannot catch the class of bug it
      # was written for anyway: a GitHub macOS runner ships only the newest iOS
      # runtime, and the newest runtime is precisely the one where a
      # back-deployment failure does not reproduce. Run it by hand when you
      # have older runtimes installed, which is where it earns its keep.
      - name: No back-deployed Swift overlays
        run: ./check-backdeploy.sh
