name: desktop

# Called by ci.yml. The menu-bar app had never been compiled by CI, so a Tauri
# or Rust change could only be found broken on the next person's Mac.
# `cargo check` with the real sidecar staged: tauri-build refuses to run when
# an externalBin is missing, and staging it is the step people forget.
on:
  workflow_call:

jobs:
  check:
    name: cargo check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Stage the fleet sidecar
        run: |
          npm --prefix collector ci
          npm --prefix fleet ci
          ./desktop/stage-sidecar.sh
      - working-directory: desktop/src-tauri
        run: cargo check --all-targets

  launch:
    # The first time the app ever ran was this job. `cargo check` proves the
    # Tauri calls exist; this proves the binary starts, spawns `fleet up` as its
    # sidecar, stays up, and that its settings window loads and answers over
    # IPC. Linux rather than macOS because that is where Tauri's WebDriver
    # support exists (tauri-driver wraps WebKitWebDriver; there is no macOS
    # driver), and because Xvfb gives it a display without a logged-in desktop.
    # What it cannot prove is anything macOS-specific: the tray in the menu bar,
    # the Local Network grant, signing. See desktop/README.md.
    name: launch smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: linux-launch
      # Tauri 2's Linux prerequisites (webkit2gtk 4.1, appindicator for the
      # tray), plus what the smoke itself uses: Xvfb for a display, dbus for a
      # session bus, WebKitWebDriver for tauri-driver, ImageMagick to capture
      # the screen.
      #
      # WebKitWebDriver's package is webkitgtk-webdriver from Ubuntu 26.04 and
      # webkit2gtk-driver before it, and ubuntu-latest moves between the two a
      # runner at a time. Install whichever this image has a candidate for:
      # `apt-cache show` is no test, since 24.04 knows the new name and has
      # nothing to install under it.
      - name: Linux dependencies
        run: |
          sudo apt-get update
          driver=webkit2gtk-driver
          if apt-cache policy webkitgtk-webdriver | grep 'Candidate: [0-9]' >/dev/null; then
            driver=webkitgtk-webdriver
          fi
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb x11-utils dbus-x11 "$driver" imagemagick jq
      - name: Stage the fleet sidecar
        run: |
          npm --prefix collector ci
          npm --prefix fleet ci
          ./desktop/stage-sidecar.sh
      - name: Build the app
        working-directory: desktop/src-tauri
        # custom-protocol is what `cargo tauri build` turns on: the frontend is
        # embedded and served from the binary, as it is in a release, rather
        # than expected from a dev server.
        run: cargo build --features custom-protocol
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Launch it
        run: ./desktop/ci/launch-smoke.sh
        env:
          OUT: ${{ runner.temp }}/desktop-smoke
      - if: always()
        name: What it printed
        run: |
          for f in "$RUNNER_TEMP"/desktop-smoke/*.log "$RUNNER_TEMP"/desktop-smoke/fleet-home/logs/*.log; do
            [ -f "$f" ] || continue
            echo "== $f"; tail -80 "$f"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-launch-smoke
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: warn
