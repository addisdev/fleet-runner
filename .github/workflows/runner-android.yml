name: runner-android

# Called by ci.yml, which owns the change detection and the `ci-ok` check
# that branch protection requires. Nothing else triggers this file.
on:
  workflow_call:

defaults:
  run:
    working-directory: runner-android

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      # Deliberately without submodules. -Pfleet.skipNative drops the native
      # build, so llama.cpp is never compiled here and cloning it would cost
      # more than the tests do.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: runner-android

      # The JVM tests cover the protocol, the synthetic backend's scaling, the
      # cancellation registry and the thermal curve's bookkeeping -- none of
      # which call into the native library. The arm64 llama.cpp build takes
      # about fifteen minutes and needs a pinned NDK, so it is verified on a
      # developer machine (and by the phones that actually run the benchmarks)
      # rather than on every push.
      - run: ./gradlew :app:testDebugUnitTest -Pfleet.skipNative

      # Lint catches what the JVM tests cannot see: a manifest an installer or
      # a store would refuse, or an API call above minSdk 24 that only crashes
      # on the old devices the fleet exists for. Errors fail the job.
      - run: ./gradlew :app:lintDebug -Pfleet.skipNative
