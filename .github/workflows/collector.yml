name: collector

# Called by ci.yml, which owns the change detection and the `ci-ok` check
# that branch protection requires. Nothing else triggers this file.
#
# This suite is still only run when something under collector/ changed -- a
# change to a phone runner has no business spinning up a Node matrix. What
# moved to ci.yml is the consequence: a path-filtered workflow can never
# itself be a required check, because GitHub reports a check that never ran
# as pending forever. The gate there always runs and reports for all four.
on:
  workflow_call:

defaults:
  run:
    working-directory: collector

jobs:
  test:
    # The collector had never run on Windows. It could not: the database was
    # better-sqlite3, a native addon, and the suite's "start a real collector on
    # a kernel-assigned port with a temporary database" step meant every run
    # needed a compiled binary for the platform under test. Replacing it with
    # node:sqlite -- which is in the runtime, on every platform Node ships for,
    # with nothing to compile -- is what made a Windows run possible at all, and
    # this row is what proves the replacement was complete. A single leftover
    # native import passes on Linux and fails here.
    #
    # ubuntu-24.04-arm is the same argument for the other axis: the brain is
    # meant to run on a Raspberry Pi, and this is the cheapest proof that it
    # will before anybody puts one on a shelf. runner-machine.yml has run both
    # for a while; the collector had neither. Both are free for public
    # repositories.
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both versions report, so a failure on one does not hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24"]
        include:
          # One Node version off the main axis for each added platform. The
          # matrix here is about the operating system, and doubling each new one
          # by Node version buys a second run of the same JavaScript.
          - os: windows-latest
            node: "24"
          - os: ubuntu-24.04-arm
            node: "24"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            collector/package-lock.json
            collector/dash/package-lock.json

      - run: npm ci

      # The dashboard has its own package.json, so `npm test` skips building it
      # when its modules are absent rather than failing on a missing binary.
      # This step is what makes that build actually happen here.
      #
      # Honestly: this step is the one most likely to behave differently on
      # Windows, and it has not been watched do so. `npm --prefix` resolves
      # relative to the drive rather than the working directory in some npm
      # versions, and the dashboard's build shells out through npm to a binary
      # that is a `.cmd` shim there rather than an executable. If the Windows
      # row goes red, read this step's log before assuming the collector itself
      # is at fault -- and if it turns out to be `--prefix`, the fix is
      # `working-directory: collector/dash` rather than a skip.
      - name: Install dashboard dependencies
        run: npm --prefix dash ci

      # Playwright is a dependency but its browsers are not downloaded: nothing
      # in this suite drives a browser. The web-* workloads that do are run by
      # an executor on real hardware, not here.
      #
      # CI=1 also makes the metric-name check fail on a stale schemas/metrics.json
      # rather than quietly regenerating it. That file is what an agent working in
      # a runner directory reads, and a mirror that lags its schema states a
      # contract confidently and wrongly.
      - run: npm test
