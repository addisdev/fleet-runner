name: ci

# The entry point for every push and pull request, and the only workflow whose
# name belongs in branch protection.
#
# Why this exists at all: the four component suites are path-filtered, because
# a change to a phone runner has no business spinning up a Node matrix or a
# macOS runner. But GitHub reports a required check that never ran as *pending
# forever*, so a path-filtered workflow can never itself be a required check --
# an iOS-only pull request would sit blocked on the collector's suite until
# somebody force-merged it.
#
# So the suites became reusable workflows, called from here behind a change
# detector, and `ci-ok` at the bottom always runs and reports. It is the one
# check to require. A suite that was skipped because nothing it watches changed
# counts as success; a suite that actually failed fails the gate.

on:
  push:
    branches: [main, develop]
  pull_request:

# A second push to a pull request makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.filter.outputs.collector }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      machine: ${{ steps.filter.outputs.machine }}
      fleet: ${{ steps.filter.outputs.fleet }}
      roku: ${{ steps.filter.outputs.roku }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs both ends of the range in this checkout, and
          # the default shallow clone has neither.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # An absent base, the all-zero sha of a branch's first push, or a sha
          # this checkout does not have all mean the same thing: the range is
          # unknowable. Run everything. Guessing wrong in the other direction
          # skips a suite silently, which is the failure this file exists to
          # prevent.
          if [ -z "${BASE:-}" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base unusable ('${BASE:-}') -- running every suite"
            CHANGED="__ALL__"
          else
            CHANGED="$(git diff --name-only "$BASE" HEAD)"
            echo "changed files:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
          fi

          match() {
            if [ "$CHANGED" = "__ALL__" ]; then
              echo true
            elif printf '%s\n' "$CHANGED" | grep -qE "$1"; then
              echo true
            else
              echo false
            fi
          }

          # ci.yml is in every pattern on purpose: a change to the gate itself
          # should be proved against all four suites, not merged on the word of
          # a detector it just edited.
          {
            echo "collector=$(match '^(collector/|\.github/workflows/(collector|ci)\.yml)')"
            echo "android=$(match '^(runner-android/|\.github/workflows/(runner-android|ci)\.yml)')"
            echo "ios=$(match '^(runner-ios/|\.github/workflows/(runner-ios|ci)\.yml)')"
            echo "machine=$(match '^(runner-machine/|\.github/workflows/(runner-machine|ci)\.yml)')"
            # fleet supervises the collector and the machine agent and imports
            # both, so a change to either can break it. Its filter is
            # deliberately wider than its own directory.
            echo "fleet=$(match '^(fleet/|collector/|runner-machine/|skills/|\.github/workflows/(fleet|ci)\.yml)')"
            echo "roku=$(match '^(runner-roku/|\.github/workflows/(runner-roku|ci)\.yml)')"
            echo "desktop=$(match '^(desktop/|\.github/workflows/(desktop|ci)\.yml)')"
          } | tee -a "$GITHUB_OUTPUT"

  # Not path-filtered and not conditional: the version spans every component, so
  # a change to any one of them can break it, and a check that only runs when
  # the collector changed would miss the Android bump that did.
  version:
    name: one version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/version.mjs check

  # Also unconditional, and for the same reason as `version`: the numbers it
  # checks are written in README.md and docs/, so a docs-only pull request is
  # exactly where a stale one arrives, and no component suite runs for that.
  repo-scripts:
    name: repo scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for scripts/
        run: node --test scripts/*.test.mjs
      - name: Documented counts match the code
        run: node scripts/check-counts.mjs

  # A release pull request -- a `release/*` branch, or `develop` into `main` --
  # must mention every pull request merged into develop since the last tag.
  # Every other pull request skips this, and skipped counts as green below.
  changelog:
    name: changelog coverage
    if: >-
      github.event_name == 'pull_request' && (
        startsWith(github.head_ref, 'release/') ||
        (github.head_ref == 'develop' && github.base_ref == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags and the whole of develop's history since the last one.
          fetch-depth: 0
      - name: Every merged pull request is in the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/changelog-coverage.mjs --head "${{ github.event.pull_request.head.sha }}"

  collector:
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    uses: ./.github/workflows/collector.yml

  runner-android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/runner-android.yml

  runner-ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/runner-ios.yml

  runner-machine:
    needs: changes
    if: needs.changes.outputs.machine == 'true'
    uses: ./.github/workflows/runner-machine.yml

  fleet:
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    uses: ./.github/workflows/fleet.yml

  runner-roku:
    needs: changes
    if: needs.changes.outputs.roku == 'true'
    uses: ./.github/workflows/runner-roku.yml

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml

  ci-ok:
    name: ci-ok
    needs: [changes, version, repo-scripts, changelog, collector, runner-android, runner-ios, runner-machine, fleet, runner-roku, desktop]
    # Without this the gate inherits the default "only if every dependency
    # succeeded", which makes a skipped suite skip the gate -- and a skipped
    # required check never reports, which is the exact bug being fixed.
    # !cancelled(), not always(): a run that cancel-in-progress superseded has no
    # verdict to give, and always() failed the gate on its cancelled jobs (kit v1.40.4).
    # It still runs when a job fails or times out.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every suite green or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "suite results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::a suite reported '$result'"
                exit 1
                ;;
            esac
          done
          echo "all suites green or skipped"
