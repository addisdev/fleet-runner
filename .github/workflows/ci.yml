name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      # Deliberately without submodules. -Pfleet.skipNative drops the native
      # build, so llama.cpp is never compiled here and cloning it would cost
      # more than the tests do.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests cover the protocol, the synthetic backend's scaling, and
      # the result shapes -- none of which call into the native library. The
      # arm64 llama.cpp build takes about fifteen minutes and needs a pinned
      # NDK, so it is verified on a developer machine (and by the phones that
      # actually run the benchmarks) rather than on every push.
      - run: ./gradlew :app:testDebugUnitTest -Pfleet.skipNative
