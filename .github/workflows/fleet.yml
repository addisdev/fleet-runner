name: fleet

# Called by ci.yml, which owns the change detection and the `ci-ok` check that
# branch protection requires. Nothing else triggers this file.
on:
  workflow_call:

defaults:
  run:
    working-directory: fleet

jobs:
  test:
    # The three desktop platforms, because that is the claim `fleet` makes and
    # it had only ever been run on one of them. The supervisor is the part most
    # likely to differ: process groups, signal delivery and what SIGTERM does to
    # a child are three things macOS, Linux and Windows each do their own way,
    # and the suite spawns real children rather than mocking them precisely so
    # that those differences show up here rather than on somebody's machine.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: fleet/package-lock.json

      - run: npm ci

      # The end-to-end test in test/up.test.ts supervises the REAL collector and
      # the REAL machine agent, so both need their own dependencies. It skips
      # itself when they are absent rather than failing, which is right for a
      # developer running `npm test` in fleet/ alone -- and wrong here, where a
      # silently skipped end-to-end test is the whole job passing for no reason.
      # So they are installed, and the step below asserts it did not skip.
      - name: Dependencies for the components it supervises
        working-directory: .
        run: |
          npm --prefix collector ci
          npm --prefix runner-machine ci

      - run: npm test

      # `npm test` prints "skipped 1" rather than failing when the components
      # are missing. That is the correct behaviour and a terrible thing to have
      # go unnoticed in CI, so the count is checked.
      - name: The end-to-end test actually ran
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx tsx --test --test-timeout 200000 test/up.test.ts 2>&1 || true)"
          echo "$out" | tail -20
          if echo "$out" | grep -qE '^# skipped 1'; then
            echo "::error::the fleet up end-to-end test skipped itself"
            exit 1
          fi
          echo "$out" | grep -qE '^# pass 1'

      # The bundle is what a release ships, and a bundle that does not build is
      # a release that cannot be cut. Built here on every platform because
      # esbuild resolves paths differently on Windows and the assets are copied
      # with node's own fs, which is where a separator bug would live.
      - run: npm run build

      - name: The bundle runs with nothing installed beside it
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cp -r "$GITHUB_WORKSPACE/fleet/dist" release
          cd release
          node bin/fleet.mjs version
          # doctor exits 0 on a machine missing every optional toolchain, which
          # is what a CI runner is. What is being checked is that it RUNS -- the
          # bundled agent probes, the bundled collector's browser check, and the
          # config file all load from inside one file with no node_modules.
          FLEET_HOME="$RUNNER_TEMP/fleet-home" node bin/fleet.mjs doctor

  container:
    # docs/install/docker.md used to say nobody had built this image. Build it,
    # run it the way the docs say, and drive it through the CLI from outside:
    # a container whose port is published but whose collector never answers is
    # the failure a `docker build` alone would call green.
    #
    # The arm64 row builds natively on GitHub's arm64 runner rather than under
    # QEMU on the amd64 one. The release publishes linux/arm64 from a QEMU
    # build, and an image that only ever ran emulated is the one a Raspberry Pi
    # owner would be first to start for real.
    name: container smoke${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: " (arm64)"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: fleet/package-lock.json
      - working-directory: .
        run: |
          docker build -f fleet/Dockerfile -t fleet:ci .
          docker image inspect fleet:ci --format 'built for {{.Os}}/{{.Architecture}}'

      - working-directory: .
        run: docker run -d --name fleet -p 8788:8788 fleet:ci up --role brain,agent
      - name: The collector answers, and the machine agent registers
        shell: bash
        env:
          EXPECT_ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          arch=$(docker exec fleet uname -m)
          echo "container is running on $arch"
          [ "$arch" = "$EXPECT_ARCH" ] || { echo "::error::expected $EXPECT_ARCH, the container says $arch"; exit 1; }
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/api/v1/health && break
            sleep 2
          done
          npm --prefix ../collector ci
          npm ci
          for i in $(seq 1 30); do
            n=$(npx tsx src/cli.ts devices --url http://127.0.0.1:8788 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).items.length))')
            [ "$n" -gt 0 ] && break
            sleep 2
          done
          [ "$n" -gt 0 ] || { echo "::error::no device registered inside the container"; docker logs fleet; exit 1; }
          npx tsx src/cli.ts workloads --url http://127.0.0.1:8788 --json > /dev/null
          npx tsx src/cli.ts whoami --url http://127.0.0.1:8788
      - if: failure()
        run: docker logs fleet

  systemd:
    # `fleet service install` on Linux writes a user unit and enables it. Run it
    # on a real systemd and check the collector it starts answers, then that
    # uninstall leaves nothing running.
    name: systemd smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: fleet/package-lock.json
      - run: npm ci && npm --prefix ../collector ci && npm run build
      - name: Install as a user service, and it serves
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          mkdir -p "$HOME/.fleet"
          cp -R dist/. "$HOME/.fleet/"
          node "$HOME/.fleet/bin/fleet.mjs" service install
          systemd-analyze --user verify "$HOME/.config/systemd/user/fleet.service"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/api/v1/health >/dev/null
          node "$HOME/.fleet/bin/fleet.mjs" service status
          node "$HOME/.fleet/bin/fleet.mjs" service uninstall
          sleep 3
          if curl -fsS http://127.0.0.1:8788/api/v1/health 2>/dev/null; then
            echo "::error::the collector is still answering after uninstall"
            exit 1
          fi
      - if: failure()
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          journalctl --user -u fleet.service --no-pager | tail -100 || true

  launchd:
    # The twin of the systemd smoke for macOS. `fleet service install` writes a
    # user LaunchAgent and bootstraps it into the gui/<uid> domain; GitHub's
    # macOS runners run their jobs inside a logged-in GUI session, so that
    # domain exists here the way it does on a desk. The first step says so
    # rather than assuming it, because a runner without one would make every
    # later failure look like a fleet bug.
    name: launchd smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: fleet/package-lock.json
      - run: npm ci && npm --prefix ../collector ci && npm run build
      - name: The runner has a GUI launchd domain
        shell: bash
        run: |
          set -euo pipefail
          echo "uid $(id -u), user $(id -un)"
          launchctl print "gui/$(id -u)" | head -15
      - name: Install as a LaunchAgent, it serves, and its agent registers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.fleet"
          cp -R dist/. "$HOME/.fleet/"
          fleet() { node "$HOME/.fleet/bin/fleet.mjs" "$@"; }
          plist="$HOME/Library/LaunchAgents/com.addisdev.fleet.plist"
          fleet service install
          plutil -lint "$plist"
          launchctl print "gui/$(id -u)/com.addisdev.fleet" | head -20
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/api/v1/health >/dev/null
          n=0
          for i in $(seq 1 30); do
            n=$(fleet devices --url http://127.0.0.1:8788 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).items.length))')
            [ "$n" -gt 0 ] && break
            sleep 2
          done
          [ "$n" -gt 0 ] || { echo "::error::the agent under launchd never registered"; exit 1; }
          fleet devices --url http://127.0.0.1:8788
          fleet service status
          # Reinstalling is bootout-then-bootstrap, the race service.ts retries.
          # Run it once here so the retry is exercised rather than trusted.
          fleet service install
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/api/v1/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/api/v1/health >/dev/null
          fleet service uninstall
          sleep 5
          if curl -fsS http://127.0.0.1:8788/api/v1/health 2>/dev/null; then
            echo "::error::the collector is still answering after uninstall"
            exit 1
          fi
          [ ! -e "$plist" ] || { echo "::error::$plist is still there after uninstall"; exit 1; }
          if launchctl print "gui/$(id -u)/com.addisdev.fleet" >/dev/null 2>&1; then
            echo "::error::launchd still has com.addisdev.fleet loaded after uninstall"
            exit 1
          fi
          if fleet service status; then
            echo "::error::fleet service status exited 0 after uninstall"
            exit 1
          fi
      - if: failure()
        shell: bash
        run: |
          tail -100 "$HOME/.fleet/logs/fleet.log" || true
          for f in "$HOME"/.fleet/logs/*.log; do echo "== $f"; tail -40 "$f"; done || true

  windows-task:
    # `fleet service install` on Windows creates a scheduled task that runs
    # `fleet up` at logon and starts it at once. Same lifecycle as the systemd
    # and launchd smokes: install, it serves, its agent registers, status says
    # so, uninstall, and nothing is left answering.
    name: windows task smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: fleet/package-lock.json
      - shell: bash
        run: npm ci && npm --prefix ../collector ci && npm run build
      - name: Install as a scheduled task, it serves, and its agent registers
        shell: bash
        run: |
          set -euo pipefail
          home="$(cygpath -u "$USERPROFILE")/.fleet"
          mkdir -p "$home"
          cp -R dist/. "$home/"
          fleet() { node "$home/bin/fleet.mjs" "$@"; }
          fleet service install
          schtasks //Query //TN FleetRunner //FO LIST //V
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8788/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/api/v1/health >/dev/null
          n=0
          for i in $(seq 1 30); do
            n=$(fleet devices --url http://127.0.0.1:8788 --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).items.length))')
            [ "$n" -gt 0 ] && break
            sleep 2
          done
          [ "$n" -gt 0 ] || { echo "::error::the agent under the scheduled task never registered"; exit 1; }
          fleet devices --url http://127.0.0.1:8788
          fleet service status
          fleet service uninstall
          sleep 5
          if curl -fsS http://127.0.0.1:8788/api/v1/health 2>/dev/null; then
            echo "::error::the collector is still answering after uninstall"
            exit 1
          fi
          if schtasks //Query //TN FleetRunner >/dev/null 2>&1; then
            echo "::error::the FleetRunner task is still there after uninstall"
            exit 1
          fi
      - if: failure()
        shell: bash
        run: |
          home="$(cygpath -u "$USERPROFILE")/.fleet"
          schtasks //Query //TN FleetRunner //FO LIST //V || true
          for f in "$home"/logs/*.log; do echo "== $f"; tail -60 "$f"; done || true
          tasklist //FI "IMAGENAME eq node.exe" || true
