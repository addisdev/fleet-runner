name: FleetRunner
options:
  bundleIdPrefix: com.taylab
  deploymentTarget:
    iOS: "17.0"
targets:
  FleetRunner:
    type: application
    platform: iOS
    sources: [FleetRunner]
    dependencies:
      # Built from fleet-runner-android/third_party/llama.cpp (same pinned
      # commit as the Android JNI backend): ./build-xcframework.sh — run it
      # from a path without spaces — then copy build-apple/llama.xcframework
      # here. Gitignored; the app builds without it (LlamaCppBackend is
      # compiled out via canImport).
      - framework: Frameworks/llama.xcframework
        embed: true
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylab.fleetrunner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
    info:
      path: FleetRunner/Info.plist
      properties:
        NSAppTransportSecurity:
          # The collector speaks plain HTTP inside the Tailscale mesh / localhost.
          NSAllowsLocalNetworking: true
